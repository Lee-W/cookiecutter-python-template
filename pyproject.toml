[project]
name = "cookiecutter-python-template"
version = "3.0.0"
description = "Python Project template that supports PyPI publishment and basic docker image"
readme = "docs/README.md"
requires-python = ">=3.11"
authors = [{ "name" = "Wei Lee", "email" = "weilee.rx@gmail.com" }]
license = { text = "LICENSE" }


[dependency-groups]
dev = ["invoke>=3.0.3"]
test = [
    "pytest-cookies>=0.7.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "pytest-xdist>=3.8.0",
    "pytest>=9.1.1",
    "coverage[toml]>=7.17.0",
    "pipenv>=2026.10.2",
    "poetry>=2.5.1",
    "uv>=0.13.5",
    "poethepoet>=0.49.0",
    "rust-just>=1.59.0",
    "build>=1.6.1",
    "pyyaml>=6.0.3",
]
style = ["ruff>=0.17.2", "mypy>=2.4.0"]
security = ["pip-audit>=2.10.1"]
doc = ["mkdocs-material>=9.7.7", "mkdocs>=1.6.1"]
git = ["commitizen>=4.19.2", "pre-commit>=4.7.0"]


[tool.uv]
default-groups = ["dev", "test", "style", "security", "git", "doc"]


[tool.commitizen]
name = "cz_conventional_commits"
version = "3.0.0"
tag_format = "$version"
version_files = ["cookiecutter.json", "pyproject.toml"]


[tool.mypy]
files = ["tasks", "hooks", "tests"]
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true


[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = [
    "I",     # Missing required import (auto-fixable)
    "UP",    # Pyupgrade
    "PT",    # flake8-pytest-style rules
    "TID25", # flake8-tidy-imports rules
    "S",     # security rules
]

ignore = ["E501", "D1", "D415"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.pytest]
minversion = "9.0.0"
testpaths = ["tests"]
addopts = ["--strict-markers"]
norecursedirs = [
    ".*",
    "build",
    "dist",
    "CVS",
    "_darcs",
    "{arch}",
    "*.egg",
    "venv",
    "env",
    "virtualenv",
]
markers = ["slow"]


[tool.coverage]
[tool.coverage.report]
show_missing = true
exclude_lines = [
    # Have to re-enable the standard pragma
    'pragma: no cover',

    # Don't complain about missing debug-only code:
    'def __repr__',
    'if self\.debug',

    # Don't complain if tests don't hit defensive assertion code:
    'raise AssertionError',
    'raise NotImplementedError',

    # Don't complain if non-runnable code isn't run:
    'if 0:',
    'if __name__ == .__main__.:',
]
omit = ['env/*', 'venv/*', '*/virtualenv/*', '*/virtualenvs/*', '*/tests/*']
