{#- Single place that decides how workflows invoke the project task runner -#}
{%- set tool = cookiecutter.dependency_management_tool -%}
{%- if cookiecutter.task_runner == "invoke" -%}
{%- set run_task = "inv" -%}
{%- set dot = "." -%}
{%- elif cookiecutter.task_runner == "poethepoet" -%}
{%- set run_task = "uv run poe" if tool == "uv" else tool ~ " run poe" -%}
{%- set dot = "-" -%}
{%- else -%}
{%- set run_task = "just" -%}
{%- set dot = "-" -%}
{%- endif -%}
{%- set runner_pkgs = {"invoke": tool ~ " invoke", "poethepoet": tool ~ " poethepoet", "just": tool}[cookiecutter.task_runner] -%}
name: {{ cookiecutter.default_branch }} branch updated

on:
  push:
    branches:
      - {{ cookiecutter.default_branch }}

permissions:
  contents: read

concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: false

jobs:
  bump-version:
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    runs-on: ubuntu-latest
    name: "Bump version and create changelog with commitizen"
    steps:
      - name: Check out
        uses: actions/checkout@{{ cookiecutter._actions_checkout_version }}
        with:
          token: {% raw %}${{ secrets.PERSONAL_ACCESS_TOKEN }}{% endraw %}
          fetch-depth: 0
          persist-credentials: false

      - name: Create bump and changelog
        uses: commitizen-tools/commitizen-action@{{ cookiecutter._commitizen_action_version }}
        with:
          github_token: {% raw %}${{ secrets.PERSONAL_ACCESS_TOKEN }}{% endraw %}
          branch: {{ cookiecutter.default_branch }}

  publish-github-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@{{ cookiecutter._actions_checkout_version }}
        with:
          token: {% raw %}${{ secrets.PERSONAL_ACCESS_TOKEN }}{% endraw %}
          fetch-depth: 0
{% if cookiecutter.dependency_management_tool == "uv" %}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@{{ cookiecutter._setup_uv_version }}
        with:
          enable-cache: true
          version: "latest"
          python-version: "{{ cookiecutter.python_version }}"

{% if cookiecutter.task_runner == "just" %}      - name: Install just
        uses: extractions/setup-just@{{ cookiecutter._setup_just_version }}

{% endif %}      - name: Install doc dependencies
        run: |
{%- if cookiecutter.task_runner == "invoke" %}
          uv tool install invoke
{%- endif %}
          {{ run_task }} env{{ dot }}init-dev --groups-to-install doc --no-pre-commit
{% else %}
      - name: Set up Python {{ cookiecutter.python_version }}
        uses: actions/setup-python@{{ cookiecutter._actions_setup_python_version }}
        with:
          python-version: "{{ cookiecutter.python_version }}"

{% if cookiecutter.task_runner == "just" %}      - name: Install just
        uses: extractions/setup-just@{{ cookiecutter._setup_just_version }}

{% endif %}      - name: Install doc dependencies
        run: |
          python -m pip install -U pip {{ runner_pkgs }}
          {{ run_task }} env{{ dot }}init-dev --groups-to-install doc --no-pre-commit
{% endif %}
      - name: Build docs
        run: |
          {{ run_task }} doc{{ dot }}build

      - name: Push documentation to Github Page
        uses: peaceiris/actions-gh-pages@{{ cookiecutter._gh_pages_version }}
        with:
          personal_token: {% raw %}${{ secrets.PERSONAL_ACCESS_TOKEN }}{% endraw %}
          publish_branch: gh-pages
          publish_dir: ./site
