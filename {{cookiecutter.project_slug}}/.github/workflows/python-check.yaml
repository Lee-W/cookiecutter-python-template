{#- Single place that decides how workflows invoke the project task runner -#}
{%- set tool = cookiecutter.dependency_management_tool -%}
{%- if cookiecutter.task_runner == "invoke" -%}
{%- set run_task = "inv" -%}
{%- set dot = "." -%}
{%- elif cookiecutter.task_runner == "poethepoet" -%}
{%- set run_task = "uv run poe" if tool == "uv" else tool ~ " run poe" -%}
{%- set dot = "-" -%}
{%- else -%}
{%- set run_task = "just" -%}
{%- set dot = "-" -%}
{%- endif -%}
{%- set runner_pkgs = {"invoke": tool ~ " invoke", "poethepoet": tool ~ " poethepoet", "just": tool}[cookiecutter.task_runner] -%}
name: New pull request received

on:
  pull_request:
  push:
    branches:
      - {{ cookiecutter.default_branch }}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: {% raw %}${{ github.workflow }}-${{ github.ref }}{% endraw %}
  cancel-in-progress: true

jobs:
  # Lint, type check and the other pre-commit hooks only need to run once, on the oldest supported Python
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@{{ cookiecutter._actions_checkout_version }}
        with:
          fetch-depth: 0
{% if cookiecutter.dependency_management_tool == "uv" %}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@{{ cookiecutter._setup_uv_version }}
        with:
          enable-cache: true
          version: "latest"
          python-version: "{{ cookiecutter.python_version }}"

{% if cookiecutter.task_runner == "just" %}      - name: Install just
        uses: extractions/setup-just@{{ cookiecutter._setup_just_version }}

{% endif %}      - name: Install dependencies
        run: |
{%- if cookiecutter.task_runner == "invoke" %}
          uv tool install invoke
{%- endif %}
          {{ run_task }} env{{ dot }}init-dev --no-pre-commit
{% else %}
      - name: Set up Python {{ cookiecutter.python_version }}
        uses: actions/setup-python@{{ cookiecutter._actions_setup_python_version }}
        with:
          python-version: "{{ cookiecutter.python_version }}"

{% if cookiecutter.task_runner == "just" %}      - name: Install just
        uses: extractions/setup-just@{{ cookiecutter._setup_just_version }}

{% endif %}      - name: Install dependencies
        run: |
          python -m pip install -U pip {{ runner_pkgs }}
          {{ run_task }} env{{ dot }}init-dev --no-pre-commit
{% endif %}
      - name: Run pre-commit hooks
        run: |
          SKIP=no-commit-to-branch,commitizen-branch {{ run_task }} run-pre-commit-hooks

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [{% for version in cookiecutter._supported_python_versions if version | float >= cookiecutter.python_version | float %}"{{ version }}"{% if not loop.last %}, {% endif %}{% endfor %}]
    steps:
      - name: Check out
        uses: actions/checkout@{{ cookiecutter._actions_checkout_version }}
{% if cookiecutter.dependency_management_tool == "uv" %}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@{{ cookiecutter._setup_uv_version }}
        with:
          enable-cache: true
          version: "latest"
          python-version: "{% raw %}${{ matrix.python-version }}{% endraw %}"

{% if cookiecutter.task_runner == "just" %}      - name: Install just
        uses: extractions/setup-just@{{ cookiecutter._setup_just_version }}

{% endif %}      - name: Install dependencies
        run: |
{%- if cookiecutter.task_runner == "invoke" %}
          uv tool install invoke
{%- endif %}
          {{ run_task }} env{{ dot }}init-dev --no-pre-commit
{% else %}
      - name: Set up Python {% raw %}${{ matrix.python-version }}{% endraw %}
        uses: actions/setup-python@{{ cookiecutter._actions_setup_python_version }}
        with:
          python-version: "{% raw %}${{ matrix.python-version }}{% endraw %}"

{% if cookiecutter.task_runner == "just" %}      - name: Install just
        uses: extractions/setup-just@{{ cookiecutter._setup_just_version }}

{% endif %}      - name: Install dependencies
        run: |
          python -m pip install -U pip {{ runner_pkgs }}
          {{ run_task }} env{{ dot }}init-dev --no-pre-commit
{% endif %}
      - name: Run tests
        run: |
          {{ run_task }} test -a
