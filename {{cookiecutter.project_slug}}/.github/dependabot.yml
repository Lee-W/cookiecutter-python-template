version: 2
updates:
  -
    # Maintain dependencies for GitHub Actions
    package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "ci"
      include: "scope"
  -
    # Maintain python dependencies
    package-ecosystem: {% if cookiecutter.dependency_management_tool == "uv" %}uv{% else %}pip{% endif %}
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "build"
      include: "scope"
